<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buat akun siswa</title>
<style>
body{margin:0;background:#080c14;color:#f1f5f9;font:16px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:.3em 0}
.card{background:#121824;border:1px solid #1e293b;border-radius:16px;padding:18px 20px;margin:14px 0}
label{display:block;margin:10px 0 4px;color:#94a3b8;font-size:.9rem}
input[type=text],input[type=password],textarea{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1.5px solid #1e293b;border-radius:12px;background:#0d131f;color:#f1f5f9}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
button{font:inherit;font-weight:700;background:#00f2fe;color:#080c14;border:0;border-radius:12px;padding:12px 20px;margin:12px 8px 0 0;cursor:pointer}
button.alt{background:transparent;color:#00f2fe;border:1.5px solid #00f2fe}
button:disabled{opacity:.4}
.mu{color:#94a3b8;font-size:.9rem}.bad{color:#ff2a6d}.ok{color:#00e676}
pre{background:#0d131f;border-radius:12px;padding:12px;max-height:260px;overflow:auto;font-size:.8rem;white-space:pre-wrap}
.bar{height:10px;background:#0f172a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#00f2fe}
</style></head><body><main>
<h1>Buat akun siswa</h1>
<p class="mu">Halaman sementara untuk membuat akun dari <b>siswa.csv</b>. Semua berjalan di browsermu dan hanya berbicara dengan Supabase. <b>Hapus halaman ini dari tempat hosting setelah selesai.</b></p>
<div class="card">
<label>URL Supabase<input type="text" id="url" value="https://hihfnbnlhkkmxkrkknpv.supabase.co" autocapitalize="none"></label>
<label>Secret key (service_role / sb_secret_…). Jangan dibagikan<input type="password" id="key" autocomplete="off"></label>
<label>File siswa.csv<input type="file" id="f" accept=".csv,text/csv,text/plain"></label>
<label>…atau tempel isi CSV di sini<textarea id="ta" placeholder="nama,kelas,username,password"></textarea></label>
<label style="display:flex;gap:8px;align-items:center;color:#f1f5f9"><input type="checkbox" id="rnd"> Buat kata sandi acak unik per siswa (abaikan kolom password)</label>
<button id="go">Buat akun</button><button class="alt" id="dl" disabled>Unduh daftar akun</button>
<div class="bar" style="margin-top:16px"><i id="pg"></i></div><p id="st" class="mu"></p><pre id="lg" hidden></pre>
</div>
<div class="card"><b>Reset kata sandi satu siswa</b>
<label>Username<input type="text" id="ru" autocapitalize="none"></label>
<label>Kata sandi baru (kosongkan untuk acak)<input type="text" id="rp" autocapitalize="none"></label>
<button class="alt" id="rs">Reset</button><p id="rr" class="mu"></p></div>
</main>
<script>
const DOMAIN='siswa.example.com'; // harus sama dengan DOM di index.html
const $=id=>document.getElementById(id);
const emailOf=u=>u.trim().toLowerCase()+'@'+DOMAIN;
const acak=()=>{const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>a[b%a.length]).join('')};
function hdr(){const k=$('key').value.trim();return{apikey:k,Authorization:'Bearer '+k,'Content-Type':'application/json'}}
async function call(path,opt={}){
  const base=$('url').value.trim().replace(/\/$/,'');
  const r=await fetch(base+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}
  if(!r.ok){const e=new Error((j&&(j.msg||j.message||j.error_description))||r.statusText);e.status=r.status;throw e}
  return j;
}
function parseCsv(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===',') {row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  const [h,...d]=rows;return d.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim().toLowerCase(),(r[i]||'').trim()])));
}
let hasil=[];
$('go').onclick=async()=>{
  const lg=$('lg'),st=$('st'),pg=$('pg');
  if(!$('key').value.trim()){st.textContent='Isi secret key dulu.';return}
  if($('key').value.trim().startsWith('sb_publishable')){st.textContent='Ini kunci publishable. Pakai secret key (sb_secret_… atau service_role).';return}
  let txt=$('ta').value;const file=$('f').files[0];if(file)txt=await file.text();
  if(!txt.trim()){st.textContent='Pilih file CSV atau tempel isinya.';return}
  const data=parseCsv(txt.replace(/^﻿/,'')),random=$('rnd').checked;
  if(!confirm(data.length+' siswa akan dibuat. Lanjut?'))return;
  $('go').disabled=true;lg.hidden=false;lg.textContent='';hasil=[['nama','kelas','username','password']];
  let i=0,done=0,ok=0,ada=0,gagal=0;
  const log=m=>{lg.textContent+=m+'\n';lg.scrollTop=lg.scrollHeight};
  async function worker(){
    while(i<data.length){
      const s=data[i++];
      if(!s.username||!s.nama){gagal++;log('GAGAL baris tidak lengkap');done++;continue}
      const sandi=random?acak():s.password;
      if(!sandi||sandi.length<6){gagal++;log('GAGAL '+s.username+': sandi kurang dari 6 karakter');done++;continue}
      let id;
      try{id=(await call('/auth/v1/admin/users',{method:'POST',body:JSON.stringify({email:emailOf(s.username),password:sandi,email_confirm:true})})).id;ok++}
      catch(e){if(e.status===422||/already/i.test(e.message))ada++;else{gagal++;log('GAGAL '+s.username+': '+e.message)}done++;pg.style.width=done/data.length*100+'%';continue}
      try{await call('/rest/v1/lms_pengguna',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id,username:s.username,nama:s.nama,kelas:s.kelas,peran:'siswa'})});hasil.push([s.nama,s.kelas,s.username,sandi])}
      catch(e){gagal++;log('GAGAL profil '+s.username+': '+e.message)}
      done++;pg.style.width=done/data.length*100+'%';st.textContent=done+' / '+data.length;
    }
  }
  await Promise.all(Array.from({length:5},worker));
  st.innerHTML=`Selesai. Dibuat: <b class="ok">${ok}</b> · sudah ada (dilewati): <b>${ada}</b> · gagal: <b class="${gagal?'bad':''}">${gagal}</b>`;
  $('go').disabled=false;$('dl').disabled=hasil.length<2;
};
$('dl').onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const b=new Blob(['﻿'+hasil.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='akun_hasil.csv';document.body.appendChild(a);a.click();a.remove();
};
$('rs').onclick=async()=>{
  const rr=$('rr'),u=$('ru').value.trim();if(!u||!$('key').value.trim()){rr.textContent='Isi secret key dan username.';return}
  try{
    const [p]=await call('/rest/v1/lms_pengguna?select=id&username=eq.'+encodeURIComponent(u));
    if(!p){rr.innerHTML='<span class="bad">Username tidak ditemukan.</span>';return}
    const sandi=$('rp').value.trim()||acak();
    await call('/auth/v1/admin/users/'+p.id,{method:'PUT',body:JSON.stringify({password:sandi})});
    rr.innerHTML=`Kata sandi <b>${u}</b> sekarang: <b class="ok">${sandi}</b>`;
  }catch(e){rr.innerHTML='<span class="bad">'+e.message+'</span>'}
};
</script></body></html>
