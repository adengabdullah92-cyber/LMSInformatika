<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LMS Algoritma Pemrograman</title>
<!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14;
  --card: #121824;
  --card-hover: #182030;
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --ac: #00f2fe;
  --ac-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  --ac-glow: rgba(0, 242, 254, 0.25);
  --sec-grad: linear-gradient(135deg, #7f00ff 0%, #e100ff 100%);
  --ok: #00e676;
  --bad: #ff2a6d;
  --bd: #1e293b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--tx);
  font: 16px/1.6 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 16px;
}

a {
  color: var(--ac);
  text-decoration: none;
  transition: all 0.2s;
}

a:hover {
  text-shadow: 0 0 8px var(--ac-glow);
}

h1 {
  font-size: 1.75rem;
  font-weight: 800;
  line-height: 1.25;
  margin: 0.5em 0 0.2em;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff 30%, var(--ac) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

h2 {
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1.35;
  margin: 0.2em 0 0.5em;
  color: #fff;
}

.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 18px 20px;
  margin: 14px 0;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  border-color: rgba(0, 242, 254, 0.3);
}

.mu {
  color: var(--mu);
  font-size: 0.9rem;
}

.bar {
  height: 10px;
  background: #0f172a;
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--bd);
  padding: 2px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--ac-grad);
  border-radius: 99px;
  box-shadow: 0 0 10px var(--ac);
  transition: width 0.4s ease;
}

a.btn, button {
  font-family: inherit;
  font-size: 0.95rem;
  background: var(--ac-grad);
  color: #080c14;
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin: 6px 8px 6px 0;
  font-weight: 700;
  box-shadow: 0 4px 15px var(--ac-glow);
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}

a.btn:hover, button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
}

a.btn:active, button:active {
  transform: translateY(1px);
}

button.alt, a.btn.alt {
  background: rgba(18, 24, 36, 0.8);
  color: var(--ac);
  border: 1.5px solid var(--ac);
  box-shadow: none;
}

button.alt:hover, a.btn.alt:hover {
  background: rgba(0, 242, 254, 0.1);
  box-shadow: 0 0 15px var(--ac-glow);
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 3px;
}

.flow {
  position: relative;
  padding-left: 54px;
  margin-top: 20px;
}

.flow::before {
  content: "";
  position: absolute;
  left: 21px;
  top: 10px;
  bottom: 10px;
  border-left: 2px dashed var(--bd);
}

.step {
  position: relative;
  display: block;
  color: inherit;
  text-decoration: none;
  margin: 16px 0;
}

.step .num {
  position: absolute;
  left: -54px;
  top: 16px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--card);
  color: var(--ac);
  border: 2px solid var(--ac);
  display: grid;
  place-items: center;
  font-weight: 800;
  box-shadow: 0 0 12px var(--ac-glow);
  z-index: 1;
}

.step.lock {
  opacity: 0.5;
}

.step.lock .num {
  background: var(--bg);
  color: var(--mu);
  border: 2px dashed var(--mu);
  box-shadow: none;
}

.step.pass .num {
  background: var(--ok);
  color: #080c14;
  border-color: var(--ok);
  box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
}

.ok { color: var(--ok); font-weight: 700; }
.bad { color: var(--bad); font-weight: 700; }

pre {
  background: #0d131f;
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 14px;
  overflow-x: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem;
  line-height: 1.5;
  color: #a5b4fc;
}

input[type=text], input[type=password] {
  font-family: inherit;
  font-size: 1rem;
  width: 100%;
  padding: 12px 16px;
  margin: 6px 0 16px;
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  background: #0d131f;
  color: var(--tx);
  transition: border-color 0.2s;
}

input[type=text]:focus, input[type=password]:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 10px var(--ac-glow);
}

.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #0d131f;
  color: var(--tx);
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  margin: 10px 0;
  padding: 14px 16px;
  font-weight: 500;
  box-shadow: none;
}

.opt:hover {
  border-color: var(--mu);
  background: #121a29;
}

.opt.on {
  border-color: var(--ac);
  background: rgba(0, 242, 254, 0.08);
  box-shadow: 0 0 12px var(--ac-glow);
  color: #fff;
}

.kartu {
  background: linear-gradient(180deg, var(--card) 0%, #0d131f 100%);
  border: 2px solid var(--ac);
  text-align: center;
  padding: 24px 20px;
  box-shadow: 0 0 30px var(--ac-glow);
}

.skor {
  font-size: 3.8rem;
  font-weight: 800;
  line-height: 1.1;
  margin: 10px 0;
  letter-spacing: -0.03em;
}

.kode {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: 0.12em;
}

table.k {
  width: 100%;
  margin-top: 14px;
  text-align: left;
  font-size: 0.95rem;
  border-collapse: collapse;
}

table.k td {
  padding: 8px 0;
  border-top: 1px solid var(--bd);
}

table.k td:last-child {
  text-align: right;
  font-weight: 600;
}

.board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(var(--c), 1fr);
  grid-template-rows: repeat(var(--r), 1fr);
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid var(--ac);
  margin: 14px 0;
  box-shadow: 0 0 20px var(--ac-glow);
  background: #0d131f;
}

.board i {
  background: rgba(18, 24, 36, 0.6);
  box-shadow: inset 0 0 0 1px var(--bd);
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: clamp(18px, 6vw, 32px);
}

.board i.wl {
  background: #1e293b;
  background-image: repeating-linear-gradient(45deg, #0f172a 0, #0f172a 10px, #1e293b 10px, #1e293b 20px);
}

.rob {
  position: absolute;
  left: 0;
  top: 0;
  transition: left 0.3s, top 0.3s;
  display: grid;
  place-items: center;
  font-size: clamp(20px, 7vw, 36px);
  filter: drop-shadow(0 0 8px var(--ac));
}

.rob u {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  text-decoration: none;
  color: var(--ac);
  font-size: 0.5em;
  transition: transform 0.3s;
}

.rob u::before { content: "▲"; }

.tok {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 14px;
  margin: 6px 0;
  background: #0d131f;
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  box-shadow: none;
}

.tok:hover {
  border-color: var(--bad);
  color: var(--bad);
}

#pal button {
  margin: 4px 6px 4px 0;
  padding: 8px 14px;
  font-size: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
}

.lv {
  display: block;
  position: relative;
  padding-left: 70px;
  color: inherit;
  text-decoration: none;
}

.lv .num {
  position: absolute;
  left: 16px;
  top: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--ac-grad);
  color: #080c14;
  display: grid;
  place-items: center;
  font-weight: 800;
  box-shadow: 0 0 10px var(--ac-glow);
}

.lv.lock {
  opacity: 0.5;
}

.lv.lock .num {
  background: var(--bg);
  color: var(--mu);
  border: 2px dashed var(--mu);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .rob, .rob u { transition: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PASS=70;
const SB='https://hihfnbnlhkkmxkrkknpv.supabase.co';
const KEY='sb_publishable_TMWv8pAbDpkUel8StVSBoQ_ZGerMesa';
async function api(path,opt={}){
  const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})}});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}
  if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||'Tidak dapat terhubung ke server');
  return j;
}
const rpc=(fn,args)=>api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(args)});
const M=[
{id:'m1',t:'Konsep Algoritma',d:'Algoritma, flowchart, pseudocode',
 s:[{h:'Apa itu algoritma?',b:`<p>Algoritma adalah urutan langkah yang jelas dan berhingga untuk menyelesaikan suatu masalah. Contohnya langkah membuat teh, atau mencari bilangan terbesar dari tiga angka.</p><p>Algoritma yang baik punya input, output, langkah yang tidak ambigu, pasti berhenti, dan efektif.</p>`},
    {h:'Flowchart dan pseudocode',b:`<p>Flowchart menggambar algoritma dengan simbol: oval untuk mulai/selesai, jajar genjang untuk input/output, persegi untuk proses, belah ketupat untuk keputusan.</p><p>Pseudocode menulis langkah dengan bahasa mirip kode tetapi bebas sintaks:</p><pre>MULAI\n  BACA a, b\n  hasil ← a + b\n  TAMPILKAN hasil\nSELESAI</pre>`}],
 q:[{q:'Ciri algoritma yang benar adalah…',o:['Boleh berjalan tanpa henti','Langkahnya jelas dan berhingga','Tidak membutuhkan input','Harus memakai bahasa Python']},
    {q:'Simbol belah ketupat pada flowchart berarti…',o:['Mulai','Proses','Keputusan','Output']},
    {q:'Penulisan langkah dengan bahasa mirip kode tanpa sintaks ketat disebut…',o:['Pseudocode','Compiler','Debugging','Syntax']},
    {q:'Simbol oval pada flowchart dipakai untuk…',o:['Keputusan','Mulai atau selesai','Perhitungan','Input data']}]},
{id:'m2',t:'Variabel, Tipe Data, Operator',d:'Wadah nilai dan cara mengolahnya',
 s:[{h:'Variabel dan tipe data',b:`<p>Variabel adalah wadah bernama untuk menyimpan nilai. Tipe data umum: integer (bilangan bulat), float (desimal), string (teks), boolean (benar/salah).</p><pre>umur ← 16\nnama ← "Sari"\nlulus ← benar</pre>`},
    {h:'Operator',b:`<p>Aritmetika: + − × ÷ dan MOD (sisa bagi). Perbandingan: =, ≠, &lt;, &gt;. Logika: AND, OR, NOT.</p><p>Contoh: 17 MOD 5 menghasilkan 2.</p>`}],
 q:[{q:'Tipe data yang tepat untuk menyimpan 3,14 adalah…',o:['Integer','Float','Boolean','String']},
    {q:'Hasil dari 17 MOD 5 adalah…',o:['3','2','12','3,4']},
    {q:'Nilai boolean hanya dapat berupa…',o:['Angka 0 sampai 9','Teks bebas','Benar atau salah','Desimal']},
    {q:'Operator AND bernilai benar jika…',o:['Salah satu kondisi benar','Kedua kondisi benar','Kedua kondisi salah','Tidak ada kondisi']}]},
{id:'m3',t:'Percabangan',d:'Memilih langkah dengan if/else',
 s:[{h:'Struktur if/else',b:`<p>Percabangan memilih langkah berdasarkan kondisi.</p><pre>JIKA nilai ≥ 70 MAKA\n  TAMPILKAN "Lulus"\nSELAIN ITU\n  TAMPILKAN "Belum lulus"\nAKHIR JIKA</pre>`},
    {h:'Percabangan bertingkat',b:`<p>Gunakan SELAIN ITU JIKA untuk beberapa kondisi. Kondisi diperiksa dari atas ke bawah; yang pertama benar dijalankan dan sisanya dilewati.</p>`}],
 q:[{q:'Percabangan dipakai untuk…',o:['Mengulang langkah','Memilih langkah berdasarkan kondisi','Menyimpan data','Menghentikan program']},
    {q:'Jika nilai = 70, hasil kondisi “nilai > 70” adalah…',o:['Benar','Salah','Error','Tidak tentu']},
    {q:'Pada if/else bertingkat, kondisi diperiksa…',o:['Dari bawah ke atas','Secara acak','Dari atas sampai ada yang benar','Semuanya sekaligus']},
    {q:'Bagian yang dijalankan bila semua kondisi salah adalah…',o:['else','if','while','return']}]},
{id:'m4',t:'Perulangan',d:'for dan while',s:[],q:[]},
{id:'m5',t:'Array dan Fungsi',d:'Data berurutan dan potongan program',s:[],q:[]},
{id:'m6',t:'Searching dan Sorting Dasar',d:'Mencari dan mengurutkan data',s:[],q:[]},
{id:'m7',t:'Rekursi dan Kompleksitas',d:'Fungsi memanggil dirinya sendiri',s:[],q:[]}
];
const app=document.getElementById('app');
const blank=()=>({name:'',kelas:'',sid:'',best:{},done:{},att:{},lab:{}});
let S=blank(),R=null,Q=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('lms')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lms',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const best=m=>S.best[m.id]??-1;
const unlocked=i=>i===0||best(M[i-1])>=PASS;
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().padStart(7,'0')};

function gate(){
  app.innerHTML=`<h1>Belajar algoritma, selangkah demi selangkah</h1><p class="mu">Masuk dengan nama, kelas, dan kode kelas dari gurumu.</p><div class="card"><label>Nama lengkap<input type="text" id="nm" autocomplete="name"></label><label>Kelas<input type="text" id="kl" placeholder="mis. X-1"></label><label>Kode kelas<input type="text" id="kd" autocapitalize="characters" autocomplete="off"></label><p id="er" class="bad" style="margin:0 0 8px"></p><button id="go">Masuk</button></div><p class="mu" style="text-align:center"><a href="#/guru">Halaman guru</a></p>`;
  document.getElementById('go').onclick=async()=>{
    const n=nm.value.trim(),k=kl.value.trim(),c=kd.value.trim();
    if(!n||!k||!c){er.textContent='Isi nama, kelas, dan kode kelas.';return}
    er.textContent='Memeriksa…';
    try{
      const sid=await rpc('masuk',{p_nama:n,p_kelas:k,p_kode:c});
      const p=await rpc('ambil_progres',{p_siswa:sid});
      S.name=n;S.kelas=k;S.sid=sid;S.best=p.best||{};S.att=p.att||{};S.lab=p.lab||{};save();route();
    }catch(e){er.textContent=e.message}
  };
}

function home(){
  const lulus=M.filter(m=>best(m)>=PASS).length;
  app.innerHTML=`<h1>Algoritma Pemrograman</h1><p class="mu">Halo, ${esc(S.name)} (${esc(S.kelas)}). Lulus satu modul untuk membuka modul berikutnya.</p>
  <div class="card"><div class="mu" style="margin-bottom:6px">${lulus} dari ${M.length} modul lulus</div><div class="bar"><i style="width:${lulus/M.length*100}%"></i></div></div>
  <a class="card" href="#/lab" style="display:block;color:inherit;text-decoration:none;border:2px solid var(--ac)"><b>🎮 Lab Koding: Robot Penjelajah</b><br><span class="mu">Susun perintah, bawa robot ke bendera. ⭐ ${labStars()} dari ${LV.length*3}</span></a>
  <div class="flow">`+M.map((m,i)=>{
    const ok=unlocked(i),has=m.q.length>0,b=best(m);
    const st=!has?'Segera hadir':!ok?`Terkunci. Lulus modul ${i} (min. ${PASS}) untuk membuka`:b>=PASS?`<span class="ok">Lulus, skor ${b}</span>`:b>=0?`Skor terbaik ${b}, belum lulus`:'Belum dikerjakan';
    const inner=`<span class="num">${ok&&has?i+1:'🔒'}</span><b>${m.t}</b><br><span class="mu">${m.d}</span><br><span class="mu">${st}</span>`;
    return ok&&has?`<a class="card step${b>=PASS?' pass':''}" href="#/m/${m.id}">${inner}</a>`:`<div class="card step lock">${inner}</div>`;
  }).join('')+`</div><p class="mu" style="text-align:center"><a href="#" id="rs" style="color:inherit">Ganti siswa</a></p>`;
  let t=0;
  document.getElementById('rs').onclick=e=>{e.preventDefault();if(!t){t=1;e.target.textContent='Ketuk lagi untuk menghapus semua progres';return}S=blank();save();route()};
}

function modul(m){
  const d=S.done[m.id]||[];
  app.innerHTML=`<a href="#/">← Beranda</a><h1>${m.t}</h1>`+m.s.map((s,i)=>`<div class="card"><h2>${s.h}</h2>${s.b}<label class="mu"><input type="checkbox" data-i="${i}" ${d[i]?'checked':''} style="margin-right:8px">Tandai selesai</label></div>`).join('')+`<a class="btn" href="#/q/${m.id}">Mulai kuis (min. ${PASS})</a>`;
  app.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{d[c.dataset.i]=c.checked;S.done[m.id]=d;save()});
}

function quiz(m){
  if(!Q||Q.id!==m.id)Q={id:m.id,i:0,a:[]};
  const q=m.q[Q.i],last=Q.i===m.q.length-1;
  app.innerHTML=`<a href="#/m/${m.id}">← Materi</a><p class="mu" style="margin-bottom:6px">${m.t}, soal ${Q.i+1} dari ${m.q.length}</p><div class="bar"><i style="width:${Q.i/m.q.length*100}%"></i></div><div class="card"><h2>${q.q}</h2>`+q.o.map((o,j)=>`<button class="opt${Q.a[Q.i]===j?' on':''}" data-j="${j}">${o}</button>`).join('')+`</div><button id="nx" ${Q.a[Q.i]===undefined?'disabled':''}>${last?'Selesai':'Lanjut'}</button>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{Q.a[Q.i]=+b.dataset.j;quiz(m)});
  document.getElementById('nx').onclick=()=>{if(!last){Q.i++;quiz(m);return}finish(m)};
}

async function finish(m){
  const bt=document.getElementById('nx');bt.disabled=true;bt.textContent='Menilai…';
  try{
    const r=await rpc('nilai_kuis',{p_siswa:S.sid,p_modul:m.id,p_jawaban:Q.a});
    S.att[m.id]=r.percobaan;S.best[m.id]=Math.max(best(m),r.skor);save();
    const ts=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
    R={id:m.id,sk:r.skor,ok:r.benar,n:r.total,att:r.percobaan,ts};
    Q=null;location.hash='#/r';
  }catch(e){bt.disabled=false;bt.textContent='Gagal terkirim, ketuk untuk coba lagi'}
}

function hasil(){
  if(!R){location.hash='#/';return}
  const i=M.findIndex(m=>m.id===R.id),m=M[i],p=R.sk>=PASS,nx=M[i+1];
  app.innerHTML=`<div class="card kartu"><div class="mu">Kartu hasil, LMS Algoritma</div><h2 style="margin-top:6px">${esc(S.name)}, ${esc(S.kelas)}</h2><div class="mu">${m.t}</div><div class="skor ${p?'ok':'bad'}">${R.sk}</div><b class="${p?'ok':'bad'}">${p?'Lulus':'Belum lulus'}</b> <span class="mu">(minimum ${PASS})</span><table class="k"><tr><td>Jawaban benar</td><td>${R.ok} dari ${R.n}</td></tr><tr><td>Percobaan ke</td><td>${R.att}</td></tr><tr><td>Waktu</td><td>${R.ts}</td></tr></table></div><p class="mu">Nilaimu sudah tersimpan dan dapat dilihat gurumu.</p>`+(p&&nx&&nx.q.length?`<a class="btn alt" href="#/m/${nx.id}">Modul berikutnya</a>`:'')+`<a class="btn alt" href="#/q/${m.id}">Coba lagi</a><a class="btn alt" href="#/">Beranda</a>`;
}

const TK={F:'⬆ Maju',L:'↺ Putar kiri',R:'↻ Putar kanan',REP2:'🔁 Ulangi 2×',REP3:'🔁 Ulangi 3×',REP4:'🔁 Ulangi 4×',WHILE:'🔁 Selama depan kosong',END:'⏹ Akhir blok'};
const BASIC=['F','L','R'],LOOPS=['F','L','R','REP2','REP3','REP4','END'];
const LV=[
{n:'Langkah pertama',h:'Urutan: robot menjalankan perintah dari atas ke bawah.',g:['S....','.....','....G'],d:2,par:7,ok:BASIC},
{n:'Tangga',h:'Pola yang berulang bisa dibungkus dengan Ulangi.',g:['S....','.....','.....','.....','....G'],d:1,par:6,ok:LOOPS},
{n:'Jalan memutar',h:'Tembok menghalangi, jadi robot harus memutar. Cobalah hemat blok.',g:['S.#.G','..#..','..#..','.....','.....'],d:2,par:11,ok:LOOPS},
{n:'Lorong panjang',h:'Selama: mengulang terus selagi kondisinya benar, tanpa menghitung langkah.',g:['.......','S.....G','.......'],d:1,par:3,ok:['F','L','R','WHILE','END']},
{n:'Ular',h:'Gabungkan semuanya: urutan, ulangi, dan selama.',g:['S....','####.','.....','.####','G....'],d:1,par:13,ok:Object.keys(TK)}
];
let LP=[],LI=0,LT=null;
const lstar=i=>(S.lab&&S.lab[i])||0;
const labStars=()=>LV.reduce((a,_,i)=>a+lstar(i),0);
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function lab(id){clearInterval(LT);const i=+id;if(id===undefined||id===''||!(i>=0&&i<LV.length)||(i>0&&!lstar(i-1)))return labList();LI=i;LP=[];labLevel()}
function labList(){
  app.innerHTML=`<a href="#/">← Beranda</a><h1>Lab Koding: Robot Penjelajah</h1><p class="mu">Susun perintah agar robot sampai ke bendera. Makin sedikit blok yang dipakai, makin banyak bintang.</p>`+LV.map((v,i)=>{const op=i===0||lstar(i-1)>0,s=lstar(i);const inner=`<span class="num">${op?i+1:'🔒'}</span><b>${v.n}</b><br><span class="mu">${op?'⭐'.repeat(s)+'☆'.repeat(3-s):'Selesaikan level sebelumnya'}</span>`;return op?`<a class="card lv" href="#/lab/${i}">${inner}</a>`:`<div class="card lv lock">${inner}</div>`}).join('');
}
function gridOf(v){let s,gl,w=[];v.g.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='S')s=[x,y];if(c==='G')gl=[x,y];if(c==='#')w.push(x+','+y)}));return{R:v.g.length,C:v.g[0].length,s,gl,w}}
function parse(){const root=[],st=[root];for(const k of LP){const cur=st[st.length-1];if(k==='END'){if(st.length>1)st.pop();continue}if(k.startsWith('REP')){const n={t:'rep',n:+k[3],b:[]};cur.push(n);st.push(n.b)}else if(k==='WHILE'){const n={t:'while',b:[]};cur.push(n);st.push(n.b)}else cur.push({t:k})}return root}
function sim(G,d0){
  let x=G.s[0],y=G.s[1],a=d0*90,out=[{x,y,a}],err='',n=0;
  const dir=()=>((a/90)%4+4)%4;
  const free=()=>{const d=dir(),nx=x+DX[d],ny=y+DY[d];return nx>=0&&ny>=0&&nx<G.C&&ny<G.R&&!G.w.includes(nx+','+ny)};
  const ex=ns=>{for(const o of ns){if(err)return;if(++n>400){err='long';return}
    if(o.t==='F'){if(!free()){err='bump';return}x+=DX[dir()];y+=DY[dir()];out.push({x,y,a})}
    else if(o.t==='L'){a-=90;out.push({x,y,a})}
    else if(o.t==='R'){a+=90;out.push({x,y,a})}
    else if(o.t==='rep'){for(let i=0;i<o.n&&!err;i++)ex(o.b)}
    else if(o.t==='while'){if(!o.b.length){err='long';return}while(!err&&free())ex(o.b)}}};
  ex(parse());return{out,err,x,y};
}
function drawProg(){
  let d=0;const p=document.getElementById('prog');
  p.innerHTML=LP.length?LP.map((k,i)=>{if(k==='END')d=Math.max(0,d-1);const h=`<button class="tok" data-i="${i}" style="margin-left:${d*18}px">${TK[k]} ✕</button>`;if(/^(REP|WHILE)/.test(k))d++;return h}).join(''):'<span class="mu">Program masih kosong. Ketuk tombol perintah di bawah. Ketuk perintah di sini untuk menghapusnya.</span>';
  p.onclick=e=>{const b=e.target.closest('[data-i]');if(b){LP.splice(+b.dataset.i,1);drawProg()}};
}
function labLevel(){
  const v=LV[LI],G=gridOf(v);let cells='';
  for(let y=0;y<G.R;y++)for(let x=0;x<G.C;x++)cells+=`<i class="${G.w.includes(x+','+y)?'wl':''}">${G.gl[0]===x&&G.gl[1]===y?'🏁':''}</i>`;
  app.innerHTML=`<a href="#/lab">← Level</a><h1>Level ${LI+1}: ${v.n}</h1><p class="mu">${v.h}</p><div class="board" style="--c:${G.C};--r:${G.R};aspect-ratio:${G.C}/${G.R}">${cells}<div id="rob" class="rob" style="width:${100/G.C}%;height:${100/G.R}%"><span>🤖</span><u id="arw"></u></div></div><div id="msg" class="card">Susun perintah, lalu tekan Jalankan. Target: ${v.par} blok atau kurang untuk 3 bintang.</div><div class="card" id="prog"></div><div id="pal">${v.ok.map(k=>`<button class="alt" data-k="${k}">${TK[k]}</button>`).join('')}</div><button id="run">▶ Jalankan</button><button class="alt" id="clr">Hapus semua</button>`;
  const rob=document.getElementById('rob'),arw=document.getElementById('arw'),msg=document.getElementById('msg');
  const setRob=s=>{rob.style.left=s.x*100/G.C+'%';rob.style.top=s.y*100/G.R+'%';arw.style.transform=`rotate(${s.a}deg)`};
  const home0={x:G.s[0],y:G.s[1],a:v.d*90};setRob(home0);drawProg();
  document.getElementById('pal').onclick=e=>{const k=e.target.dataset.k;if(k&&LP.length<30){LP.push(k);drawProg()}};
  document.getElementById('clr').onclick=()=>{clearInterval(LT);LP=[];drawProg();setRob(home0)};
  document.getElementById('run').onclick=()=>{
    if(!LP.length)return;clearInterval(LT);const r=sim(G,v.d);let i=0;setRob(r.out[0]);msg.textContent='Robot berjalan…';
    LT=setInterval(()=>{
      if(++i<r.out.length){setRob(r.out[i]);return}
      clearInterval(LT);
      if(!r.err&&r.x===G.gl[0]&&r.y===G.gl[1]){
        const n=LP.length,s=n<=v.par?3:n<=v.par+3?2:1;S.lab=S.lab||{};S.lab[LI]=Math.max(lstar(LI),s);save();rpc('simpan_lab',{p_siswa:S.sid,p_level:LI,p_bintang:s}).catch(()=>{});
        msg.innerHTML=`<b class="ok">Berhasil! ${'⭐'.repeat(s)}</b><br>${n} blok (target ${v.par}).<br>`+(LI<LV.length-1?`<a class="btn" href="#/lab/${LI+1}">Level berikutnya</a>`:`<b>Semua level selesai. Hebat!</b>`);
      }else msg.textContent=r.err==='bump'?'Robot menabrak tembok atau batas papan. Periksa lagi perintahmu.':r.err==='long'?'Program terlalu lama, mungkin ada perulangan yang tidak berujung.':'Robot belum sampai di bendera. Coba lagi.';
    },350);
  };
}
let GT=null;
function guruTabel(rows){
  const mods=M.filter(m=>m.q.length),byK={};
  rows.forEach(r=>{byK[r.kelas]=byK[r.kelas]||{};byK[r.kelas][r.siswa]=byK[r.kelas][r.siswa]||{};byK[r.kelas][r.siswa][r.modul]=r.skor_terbaik});
  const head=mods.map(m=>`<td><b>${m.id.toUpperCase()}</b></td>`).join('');
  return Object.keys(byK).map(k=>{
    const body=Object.keys(byK[k]).map(sw=>`<tr><td>${esc(sw)}</td>${mods.map(m=>{const v=byK[k][sw][m.id];return `<td class="${v==null?'mu':v>=PASS?'ok':'bad'}">${v==null?'-':v}</td>`}).join('')}</tr>`).join('');
    return `<h2 style="margin-top:16px">Kelas ${esc(k)}</h2><div style="overflow-x:auto"><table class="k"><tr><td><b>Siswa</b></td>${head}</tr>${body}</table></div>`;
  }).join('');
}
async function guruData(){
  const gd=document.getElementById('gd');gd.innerHTML='<p class="mu">Memuat…</p>';
  try{
    const rows=await api('/rest/v1/rekap_nilai?select=*&order=kelas,siswa',{headers:{Authorization:'Bearer '+GT}});
    gd.innerHTML=`<p class="mu">Skor terbaik per modul (lulus min. ${PASS}).</p>`+(rows.length?guruTabel(rows):'<p class="mu">Belum ada nilai, atau akunmu belum terdaftar sebagai guru.</p>')+`<button class="alt" id="rl">Muat ulang</button>`;
    document.getElementById('rl').onclick=guruData;
  }catch(e){gd.innerHTML='<p class="bad">Gagal memuat data. Masuk ulang.</p>';GT=null}
}
function guru(){
  app.innerHTML=`<a href="#/">← Beranda</a><h1>Halaman guru</h1>`+(GT?'':`<div class="card"><label>Email<input type="text" id="ge" autocomplete="username"></label><label>Kata sandi<input type="password" id="gp" autocomplete="current-password"></label><p id="ger" class="bad" style="margin:0 0 8px"></p><button id="gg">Masuk</button></div>`)+`<div id="gd"></div>`;
  if(GT)return guruData();
  document.getElementById('gg').onclick=async()=>{
    const er=document.getElementById('ger');er.textContent='Masuk…';
    try{
      const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:ge.value.trim(),password:gp.value})});
      GT=j.access_token;guru();
    }catch(e){er.textContent='Email atau kata sandi salah.'}
  };
}
function route(){
  scrollTo(0,0);
  if(location.hash==='#/guru')return guru();
  if(!S.name||!S.sid)return gate();
  const [,t,id]=location.hash.slice(1).split('/'),i=M.findIndex(m=>m.id===id),m=M[i];
  if(t==='r')return hasil();
  if(t==='lab')return lab(id);
  if((t==='m'||t==='q')&&m&&m.q.length&&unlocked(i)){
    if(t==='m'){Q=null;return modul(m)}
    return quiz(m);
  }
  home();
}
addEventListener('hashchange',route);
route();
</script>
